name: Visual AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: visual-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser engine
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run visual anomaly agent
        run: node scripts/test-runner.mjs visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-ai-report
          path: artifacts/visual
          if-no-files-found: ignore
          retention-days: 14
