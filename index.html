<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adivinhando — Live</title>
<style>
:root{color-scheme:dark;--bg:#071018;--card:#0f1b26;--line:#203040;--text:#f7fbff;--muted:#8fa6bb;--good:#4be38b;--hot:#ffb84d;--bad:#6f8aa1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#132638 0,#071018 42%,#04090e 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.app{width:min(900px,100%);margin:auto;padding:18px}.stage{min-height:calc(100vh - 36px);padding:26px;display:flex;flex-direction:column;background:rgba(15,27,38,.94);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:14px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.category{font-size:13px;color:var(--muted);font-weight:800}.hero{text-align:center;padding:48px 8px 26px}.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:800}.secret{margin:16px 0 8px;font-size:clamp(44px,9vw,92px);font-weight:1000;letter-spacing:.12em}.sub{color:var(--muted);font-size:15px}.winner{margin:22px auto 0;max-width:560px;padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(75,227,139,.15),rgba(124,92,255,.13));border:1px solid rgba(75,227,139,.38);display:none}.winner.show{display:block}.winner b{font-size:22px}.winner small{display:block;color:var(--muted);margin-top:5px}.board{margin-top:18px}.board-head,.row{display:grid;grid-template-columns:64px minmax(0,1fr) 110px;gap:12px}.board-head{padding:0 14px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.12em}.row{align-items:center;padding:13px 14px;margin:8px 0;border-radius:18px;background:#0a151f;border:1px solid #182837}.rank{font-size:21px;font-weight:1000}.guess strong{display:block;font-size:18px}.guess span{font-size:12px;color:var(--muted)}.heat{text-align:right;font-weight:900}.row.win{border-color:rgba(75,227,139,.55);background:rgba(75,227,139,.09)}.row.hot .heat{color:var(--hot)}.row.warm .heat{color:#f6db6c}.row.cold .heat{color:var(--bad)}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed #284054;border-radius:20px}.footer-note{margin-top:auto;padding-top:20px;color:#62788b;font-size:12px;text-align:center}@media(max-width:820px){.app{padding:10px}.stage{min-height:calc(100vh - 20px);padding:18px}.hero{padding-top:36px}.board-head,.row{grid-template-columns:56px minmax(0,1fr) 86px}.secret{font-size:clamp(38px,14vw,72px)}}
</style></head><body>
<div class="app"><main class="stage"><div class="top"><div class="brand">🎯 Adivinhando</div><div id="categoryPublic" class="category">Prepare-se!</div></div><section class="hero"><div class="eyebrow">Adivinhe a palavra secreta</div><div id="secret" class="secret">_ _ _</div><div id="roundInfo" class="sub">Comente seu palpite!</div><div id="winner" class="winner"><b id="winnerText"></b><small id="winnerMeta"></small></div></section><section class="board"><div class="board-head"><span>Rank</span><span>Tentativa</span><span>Proximidade</span></div><div id="rows"><div class="empty">As melhores tentativas aparecem aqui.</div></div></section><div class="footer-note">Quanto menor o rank, mais perto da palavra secreta.</div></main></div>
<script type="module">
import { WORD_BANK, CATEGORY_LABELS } from './words.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);const state={answer:'',category:'',round:0,tries:0,people:new Set(),seen:new Set(),results:[],extractor:null,loading:false,finished:false,cache:new Map(),auto:true,timer:null,nextTimer:null,answerVector:null};const HISTORY_KEY='adivinhando-word-history-v1',RECENT_LIMIT=120,ROUND_MS=180000;
function normalize(t=''){return String(t).trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ç\- ]/gi,'').replace(/\s+/g,' ').trim()}function mask(w){return[...w].map(c=>c===' '?'   ':'_').join(' ')}function dot(a,b){let s=0;for(let i=0;i<Math.min(a.length,b.length);i++)s+=a[i]*b[i];return s}function rank(sim){const x=Math.max(0,Math.min(1,(sim+1)/2));return Math.max(2,Math.min(99999,Math.round(2+Math.pow(1-x,3.25)*99997)))}function heat(sim,exact=false){if(exact)return{label:'✅ ACERTOU',cls:'win'};if(sim>=.72)return{label:'🔥🔥🔥',cls:'hot'};if(sim>=.55)return{label:'🔥 QUENTE',cls:'hot'};if(sim>=.38)return{label:'🟡 MORNO',cls:'warm'};return{label:'🥶 FRIO',cls:'cold'}}function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return[]}}function saveUsed(w){const h=history().filter(x=>x!==w);h.push(w);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(-RECENT_LIMIT)))}function pool(category='mixed'){if(category!=='mixed'&&WORD_BANK[category])return WORD_BANK[category].map(word=>({word,category}));return Object.entries(WORD_BANK).flatMap(([category,words])=>words.map(word=>({word,category})))}function chooseWord(category='mixed'){const all=pool(category),recent=new Set(history()),eligible=all.filter(x=>!recent.has(normalize(x.word))),source=eligible.length?eligible:all.filter(x=>!history().slice(-25).includes(normalize(x.word)));return source[Math.floor(Math.random()*source.length)]||all[0]}
async function ensureModel(){if(state.extractor)return state.extractor;if(state.loading){while(state.loading)await new Promise(r=>setTimeout(r,100));return state.extractor}state.loading=true;try{const{pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1');state.extractor=await pipeline('feature-extraction','Xenova/paraphrase-multilingual-MiniLM-L12-v2')}catch(e){console.error(e)}finally{state.loading=false}return state.extractor}async function embed(text){const key=normalize(text);if(state.cache.has(key))return state.cache.get(key);const ext=await ensureModel();if(!ext)return null;const out=await ext(key,{pooling:'mean',normalize:true}),vec=Array.from(out.data);state.cache.set(key,vec);return vec}
async function startNext(options={}){clearTimeout(state.timer);clearTimeout(state.nextTimer);const category=options.category||params.get('category')||'mixed',pick=options.word?{word:options.word,category:options.category||'objetos'}:chooseWord(category);if(!pick)return;state.answer=normalize(pick.word);state.category=pick.category;saveUsed(state.answer);state.round++;state.tries=0;state.people.clear();state.seen.clear();state.results=[];state.finished=false;state.answerVector=null;$('secret').textContent=mask(state.answer);$('categoryPublic').textContent=CATEGORY_LABELS[state.category]||'Categoria';$('roundInfo').textContent='Comente seu palpite!';$('winner').classList.remove('show');render();state.answerVector=await embed(state.answer);state.timer=setTimeout(()=>finishRound(null,true),Number(options.durationMs)||ROUND_MS)}function finishRound(username,timeout=false){if(state.finished)return;state.finished=true;clearTimeout(state.timer);$('secret').textContent=state.answer.toUpperCase();if(username){$('winnerText').textContent=`@${username} acertou!`;$('winnerMeta').textContent=`A palavra era ${state.answer.toUpperCase()}`;$('winner').classList.add('show');$('roundInfo').textContent='Mandou bem! 🎉'}else $('roundInfo').textContent=`A palavra era ${state.answer.toUpperCase()}`;if(state.auto)state.nextTimer=setTimeout(()=>startNext(),timeout?7000:5000)}async function submitGuess(username,comment){if(!state.answer||state.finished)return;const guess=normalize(comment);username=String(username||'anonimo').trim()||'anonimo';if(!guess||guess.length>60)return;const key=`${username.toLowerCase()}::${guess}`;if(state.seen.has(key))return;state.seen.add(key);state.tries++;state.people.add(username.toLowerCase());const exact=guess===state.answer;let sim=1;if(!exact){const gv=await embed(guess);sim=gv&&state.answerVector?dot(gv,state.answerVector):0}const r=exact?1:rank(sim),h=heat(sim,exact);state.results.push({username,guess,rank:r,sim,exact,heat:h.label,cls:h.cls,at:Date.now()});state.results.sort((a,b)=>a.rank-b.rank||a.at-b.at);state.results=state.results.slice(0,30);render();if(exact)finishRound(username,false)}function render(){const best=state.results.slice(0,10);$('rows').innerHTML=best.length?best.map(r=>`<div class="row ${r.cls}"><div class="rank">#${r.rank.toLocaleString('pt-BR')}</div><div class="guess"><strong>${esc(r.guess)}</strong><span>@${esc(r.username)}</span></div><div class="heat">${r.heat}</div></div>`).join(''):'<div class="empty">As melhores tentativas aparecem aqui.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='tiktok-comment'||d.type==='comment')submitGuess(d.username||d.user||d.nickname,d.comment||d.text);if(d.type==='adivinhando-control'){if(d.action==='next')startNext(d);if(d.action==='stop'){state.auto=false;clearTimeout(state.timer);clearTimeout(state.nextTimer)}if(d.action==='start'){state.auto=true;startNext(d)}}});window.Adivinhando={comment:submitGuess,start:(options={})=>{state.auto=true;return startNext(options)},next:(options={})=>startNext(options),stop:()=>{state.auto=false;clearTimeout(state.timer);clearTimeout(state.nextTimer)},state};const ws=params.get('ws');if(ws){try{const sock=new WebSocket(ws);sock.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='comment'||d.type==='tiktok-comment')submitGuess(d.username||d.user||d.nickname,d.comment||d.text);if(d.type==='adivinhando-control'&&d.action==='next')startNext(d)}catch{}}}catch(e){console.error(e)}}startNext();
</script></body></html>
